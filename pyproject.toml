[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "preference-override-pilot"
version = "0.1.0"
description = "Deterministic transport-booking pilot for preference--utility conflicts"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.4.1",
    "langchain-ollama==1.1.0",
    "langchain-groq==1.1.3",
    "langchain-openai==1.7.2",
    "langchain-google-genai==4.4.2",
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
    "gradio==6.30.0",
]

[project.scripts]
run-transport-pilot = "preference_override.cli:main"
run-transport-pilot-ui = "preference_override.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
