[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "preference-override-pilot"
version = "0.1.0"
description = "Deterministic transport-booking pilot for preference--utility conflicts"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.4.1",
    "langchain-ollama==1.1.0",
    "pydantic==2.14.1",
]

[project.scripts]
run-transport-pilot = "preference_override.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
